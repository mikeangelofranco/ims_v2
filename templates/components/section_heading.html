<div class="ui-section-heading"><span><i data-lucide="{{ icon }}" aria-hidden="true"></i></span><div><h2{% if heading_id %} id="{{ heading_id }}"{% endif %}>{{ title }}</h2><p><span{% if mobile_copy %} class="ui-section-heading__desktop-copy"{% endif %}>{{ copy }}</span>{% if mobile_copy %}<span class="ui-section-heading__mobile-copy">{{ mobile_copy }}</span>{% endif %}</p></div>{% if panel_id %}<button class="ui-section-toggle" type="button" aria-label="Toggle {{ title }}" aria-expanded="true" aria-controls="{{ panel_id }}" data-editor-panel-toggle><i data-lucide="chevron-down" aria-hidden="true"></i></button>{% endif %}</div>
