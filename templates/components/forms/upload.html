<div class="ui-upload-field"><label for="{{ field.id_for_label }}">Product Image</label><div class="ui-upload" data-image-upload><div data-product-image-preview><i data-lucide="image" aria-hidden="true"></i></div><strong>Upload Image</strong><small>PNG, JPG up to 5 MB</small><label class="ui-button ui-button--small" for="{{ field.id_for_label }}">Choose File</label>{{ field }}</div>{% for error in field.errors %}<p class="ui-field-error" id="{{ field.auto_id }}_error">{{ error }}</p>{% endfor %}<span class="ui-field-help" data-upload-filename role="status"></span></div>
