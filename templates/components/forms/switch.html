<div class="ui-switch-field"><label class="ui-switch" for="{{ field.id_for_label }}">{{ field }}<span class="ui-switch__track" aria-hidden="true"></span><span class="ui-switch__label">{{ field.label }}{% if copy %}<small>{{ copy }}</small>{% endif %}</span></label>{% for error in field.errors %}<p class="ui-field-error">{{ error }}</p>{% endfor %}</div>
