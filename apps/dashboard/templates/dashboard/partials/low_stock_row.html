<article class="low-stock-row"><div><span><i data-lucide="box" aria-hidden="true"></i></span><strong><a class="ui-product-detail-link" href="{% url 'inventory:product_detail' stock.product.pk %}">{{ stock.product.name }}</a></strong></div><span class="low-stock-sku"><b>SKU:</b> {{ stock.product.sku }}</span><span class="low-stock-quantity"><b>Stock</b><strong>{{ stock.quantity }}</strong> / {{ stock.minimum_quantity }}</span><span class="low-stock-minimum">{{ stock.minimum_quantity }}</span><span class="low-stock-location"><i data-lucide="map-pin" aria-hidden="true"></i>{{ stock.location.name }}</span><a href="{% url 'inventory:product_detail' stock.product.pk %}" aria-label="View {{ stock.product.name }}">View</a></article>
