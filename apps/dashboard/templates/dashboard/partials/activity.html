<article class="activity-row activity-row--{{ movement.movement_type }}"><span><i data-lucide="{% if movement.movement_type == 'receipt' %}package-open{% elif movement.movement_type == 'issue' %}package-minus{% else %}arrow-left-right{% endif %}" aria-hidden="true"></i></span><div><strong>{{ movement.get_movement_type_display }}: <a class="ui-product-detail-link" href="{% url 'inventory:product_detail' movement.product.pk %}">{{ movement.product.name }}</a></strong><p>{% if movement.quantity_delta > 0 %}+{% endif %}{{ movement.quantity_delta }} units{% if movement.actor %} by {{ movement.actor.first_name|default:movement.actor.email }}{% endif %}</p></div><time>{{ movement.created_at|timesince }} ago</time></article>
